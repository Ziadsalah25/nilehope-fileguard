name: Validate FileGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 discovery regression checks
        shell: powershell
        run: ./tests/Test-DockerDiscovery.ps1
      - name: PowerShell 7 discovery regression checks
        shell: pwsh
        run: ./tests/Test-DockerDiscovery.ps1
      - name: Windows PowerShell 5.1 native configuration permissions
        shell: powershell
        run: ./tests/Test-LocalPermissions.ps1
      - name: PowerShell 7 native configuration permissions
        shell: pwsh
        run: ./tests/Test-LocalPermissions.ps1
  console-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest ruff
      - run: python -m pytest -q
      - run: ruff check services tests deploy/windows scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci --prefix apps/console
      - run: npm run build --prefix apps/console
  recovery-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/recovery-engine/FileGuard.Recovery.Tests.csproj -c Release
