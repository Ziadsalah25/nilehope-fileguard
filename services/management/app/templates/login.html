{% extends "public.html" %}
{% block content %}
<form method="post" class="login-form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>
    <span>{{ 'اسم مستخدم المسؤول (Admin Username)' if session.get('lang', 'ar') == 'ar' else 'Admin Username' }}</span>
    <input name="username" autocomplete="username" placeholder="e.g. admin" required autofocus>
  </label>
  <label>
    <span>{{ 'كلمة المرور المشفرة (Password)' if session.get('lang', 'ar') == 'ar' else 'Password' }}</span>
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn-primary-block btn-lg" style="margin-top: 18px;">
    <span>{{ 'تسجيل الدخول إلى وحدة الأمان' if session.get('lang', 'ar') == 'ar' else 'Sign in to Console' }}</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
  </button>
</form>
<div class="public-foot">
  <small class="text-muted">
    {{ 'نظام أمني مخصص للوصول المصرح به فقط — جميع العمليات مسجلة' if session.get('lang', 'ar') == 'ar' else 'Restricted hospital system — all access attempts are audited' }}
  </small>
</div>
{% endblock %}
